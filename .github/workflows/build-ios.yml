name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Assets
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (No Code Signing for Direct Distribution)
        run: |
          cd ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/ElderSaath.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ElderSaath-iOS-Archive
          path: ios/App/build/ElderSaath.xcarchive
