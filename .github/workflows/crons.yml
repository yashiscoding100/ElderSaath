name: ElderSaath Background Crons

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SOS Escalation
        run: curl -s -X GET "https://eldersaath.vercel.app/api/cron/sos-escalation"
        
      - name: Trigger Unified Medication & Task Alarms
        run: curl -s -X GET "https://eldersaath.vercel.app/api/cron"
